[project]
name = "unique-exams"
version = "0.1.0"
description = "A simple program to create randomized exams so each student receives a unique set of questions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "streamlit>=1.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
